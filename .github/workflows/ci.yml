name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    name: Python checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q monitor.py protocol.py tests
      - run: python -c "import monitor; import tkinter; root = tkinter.Tk(); app = monitor.Monitor(root); root.update(); app.close()"
  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/mpu_monitor
      - run: arduino-cli compile --fqbn esp32:esp32:esp32 diagnostics/mpu_diagnostic
